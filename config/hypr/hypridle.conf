general {
    lock_cmd = ~/.local/share/quickshell/ukishima/scripts/lock.sh
    # NOT lock.sh: by the time we suspend (30 min) the screen is already locked
    # (5 min), and lock.sh would spawn a *second* Quickshell lockscreen that
    # fights the session lock already held -- systemd keeps a delay inhibitor on
    # sleep until this returns, so a stuck instance means suspend never happens.
    # loginctl is instant and a no-op when the session is already locked.
    before_sleep_cmd = loginctl lock-session
    # Hyprland 0.55+ dispatchers are Lua: the old `hyprctl dispatch dpms on`
    # keyword form fails with "')' expected". Top-level hl.dsp.* only.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock: 5 min (Ukishima flags.json idleLockMin)
listener {
    timeout = 300
    on-timeout = ~/.local/share/quickshell/ukishima/scripts/lock.sh
}

# Screen off: 6 min (Ukishima flags.json idleScreenOffMin)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend: 30 min (Ukishima flags.json idleSuspendMin = 30)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
