# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0c0f05"
set -gq @thm_bar_bg                       "#0c0f05"

set -gq @thm_bg                           "#111509"
set -gq @thm_fg                           "#e2e4d0"
set -gq @thm_primary                      "#a6d700"
set -gq @thm_inverse_primary              "#4e6700"
set -gq @thm_surface_low                  "#1a1d10"
set -gq @thm_surface                      "#1e2114"
set -gq @thm_surface_variant              "#282b1e"
set -gq @thm_outline                      "#454839"
set -gq @thm_text_variant                 "#c5c8b5"

# Re-set the options that read the vars above.
set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"
