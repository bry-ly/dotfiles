# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                    
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$username$hostname(bold fg:252)$git_branch$fill${custom.dir_icon}$directory
$character"""

[fill]
symbol = ' '
style = 'fg:245'

# Replace the "❯" symbol in the prompt with "➜"
# U+EA71 was a Nerd Font powerline circle -- a block glyph that fills the whole
# cell height, so it rendered oversized next to every other symbol. U+25CF is an
# ordinary-sized filled circle and keeps the round look. The error glyph
# U+F00D (nf-fa-times) was already normal-sized, so the two now match.
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[● ➜](bold fg:243)"
error_symbol = "[ ➜](bold fg:244)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg: 252"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:252)[$symbol $branch(:$remote_branch)](fg:235 bg:252)[ ](bold fg:252)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
style = "bold fg:252"
format = "[@archlinux]($style)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold fg:252"
style_root = "bold fg:252"
format = "[$user]($style)"
disabled = false
show_always = true

[directory]
disabled = false
home_symbol = "~"
read_only = "  "
style = "bold fg:252"
truncation_length = 2
truncation_symbol = ".../"
format = '[$read_only$path]($style)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
disabled = true
min_time = 0
format = '[](bold fg:252)[󰪢 $duration](bold bg:252 fg:235)[](bold fg:252)'

[custom.dir_icon]
command = '[ "$PWD" = "$HOME" ] || echo "󰉋 "'
when = 'true'
format = '[$output ]($style)'
style = 'bold fg:252'
disabled = false
description = 'home (~) vs folder icon for right-side directory'
