[config]

# Ryoku Arch Matugen App Templates
# Configured and toggled via Ryoku Settings (Hub) -> Appearance -> Matugen

[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk3-colors.css"
output_path = "~/.config/gtk-3.0/gtk.css"

# GTK 4 and GTK 3 read separate inputs: libadwaita 1.6+ recolours its widgets
# from CSS custom properties (:root) that GTK 3 cannot parse, so the GTK 4
# template leads with those and GTK 3 keeps the @define-color form it can read.
[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk4-colors.css"
output_path = "~/.config/gtk-4.0/gtk.css"

[templates.vesktop]
input_path = "~/.config/matugen/templates/discord.css"
output_path = "~/.config/vesktop/themes/matugen.css"

[templates.equibop]
input_path = "~/.config/matugen/templates/discord.css"
output_path = "~/.config/equibop/themes/matugen.css"

[templates.obs]
input_path = "~/.config/matugen/templates/obs.theme"
output_path = "~/.config/obs-studio/themes/matugen.theme"

[templates.zed]
input_path = "~/.config/matugen/templates/zed.json"
output_path = "~/.config/zed/themes/matugen.json"

[templates.heroic]
input_path = "~/.config/matugen/templates/heroic.css"
output_path = "~/.config/heroic/store/styles/matugen.css"

[templates.telegram]
input_path = "~/.config/matugen/templates/telegram.tdesktop-theme"
output_path = "~/.local/share/TelegramDesktop/tdata/matugen.tdesktop-theme"

[templates.steam]
input_path = "~/.config/matugen/templates/steam.css"
output_path = "~/.steam/steam/steamui/skins/Material-Theme/css/main/colors/matugen.css"

# cava renders from config.toml (core, always on) into its themes dir; the main
# config selects it via `theme = 'matugen'`. It must NOT output to
# ~/.config/cava/config directly -- that clobbers the [general]/[input]/
# [output]/[smoothing]/[eq] sections with a bare [color] block.

# ghostty/config is the user's own file; matugen writes only the palette to a
# sibling the config includes (`config-file = ryoku-colors`), so a retint never
# clobbers it -- the same split kitty uses with current-theme.conf.
[templates.ghostty]
input_path = "~/.config/matugen/templates/ghostty.conf"
output_path = "~/.config/ghostty/ryoku-colors"

[templates.micro]
input_path = "~/.config/matugen/templates/micro.micro"
output_path = "~/.config/micro/colorschemes/matugen.micro"

# Papirus ships a fixed set of named folder tints, so a raw hex from the
# wallpaper has to be snapped to the nearest name. colors_to_compare +
# compare_to do that inside matugen and expose the winner as
# {{ closest_color }}; the hook then applies it with -C (the old -c flag does
# not exist, so this hook had been failing silently on every run).
[templates.papirus]
input_path = "~/.config/matugen/templates/papirus-color"
output_path = "~/.cache/matugen/papirus-color"
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
index = 1
# sudo -n so the hook can never block on a password prompt inside a matugen
# run. It stays a no-op until a sudoers drop-in exists:
#   echo "$USER ALL=(ALL) NOPASSWD: $(command -v papirus-folders)" \
#     | sudo tee /etc/sudoers.d/papirus-folders && sudo chmod 440 /etc/sudoers.d/papirus-folders
post_hook = "command -v papirus-folders >/dev/null 2>&1 && sudo -n papirus-folders -C {{ closest_color }} >/dev/null 2>&1 || true"

[templates.fish]
input_path = "~/.config/matugen/templates/colors.fish"
output_path = "~/.config/fish/conf.d/ryoku-colors.fish"

[templates.yazi]
input_path = "~/.config/matugen/templates/yazi.toml"
output_path = "~/.config/yazi/theme.toml"

[templates.obsidian]
input_path = "~/.config/matugen/templates/obsidian.css"
output_path = "~/.config/matugen/generated/obsidian.css"

[templates.zathura]
input_path = "~/.config/matugen/templates/zathura"
output_path = "~/.config/zathura/zathurarc"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty.toml"
output_path = "~/.config/alacritty/colors.toml"

[templates.tmux]
input_path = "~/.config/matugen/templates/tmux.conf"
output_path = "~/.config/tmux/ryoku-colors.conf"

[templates.sidra]
input_path = "~/.config/matugen/templates/sidra.css"
output_path = "~/.config/Sidra/custom.css"

# Ryotunes (the native music client) reads its palette as a Ryoku skin: matugen
# renders the skin manifest into the user skins dir, where the client's Skin
# singleton picks it up as the "matugen" skin (the Settings "System" source).
[templates.ryotunes]
input_path = "~/.config/matugen/templates/ryotunes.json"
output_path = "~/.config/ryotunes/skins/matugen/skin.json"
